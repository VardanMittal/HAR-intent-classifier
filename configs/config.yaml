data:
  source: "ucimlrepo"
  dataset_id: 240
  raw_dir: "data/raw"
  processed_dir: "data/processed"

model:
  random_seed: 42
  test_size: 0.2
  cv_strategy: "random" # you will revisit this — Architecture Decision #1

mlflow:
  experiment_name: "har-intent-classifier"
  tracking_uri: "sqlite:///mlruns.db"

api:
  host: "0.0.0.0"
  port: 8000
  model_path: "models/best_model.joblib"

optuna:
  n_trials: 50
  n_jobs: 1
  direction: "maximize"
  metric: "f1_weighted"
