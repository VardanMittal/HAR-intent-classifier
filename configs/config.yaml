project:
  name: Human Activity Recognition Intent Classifier
  random_seed: 42

paths:
  data_dir: data
  raw_dir: data/raw
  processed_dir: data/processed
  models_dir: models
  artifacts_dir: artifacts

preprocessing:
  remove_duplicates: true
  scaling: false
  remove_constants: false

dataset:
  url: https://archive.ics.uci.edu/static/public/240/human+activity+recognition+using+smartphones.zip
  archive_name: UCI_HAR_Dataset.zip
  extracted_dir: UCI HAR Dataset

model:
  type: random_forest
  parameters:
    n_estimators: 100
    max_depth: null
    min_samples_split: 2
    min_samples_leaf: 1

mlflow:
  tracking_uri: sqlite:///mlflow.db
  experiment_name: har-baseline
